<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Rounded app tile -->
  <rect width="128" height="128" rx="24" fill="#17A05C"/>

  <!-- Back tab: the original tab being copied -->
  <rect x="20" y="20" width="58" height="58" rx="10" fill="#ffffff" opacity="0.55"/>
  <rect x="20" y="20" width="58" height="13" rx="6" fill="#ffffff" opacity="0.85"/>
  <circle cx="29" cy="26.5" r="2.6" fill="#17A05C" opacity="0.65"/>
  <circle cx="37" cy="26.5" r="2.6" fill="#17A05C" opacity="0.65"/>

  <!-- Front tab: the duplicate -->
  <rect x="48" y="48" width="60" height="60" rx="10" fill="#ffffff"/>
  <rect x="48" y="48" width="60" height="13" rx="6" fill="#e3efe8"/>
  <circle cx="57" cy="54.5" r="2.6" fill="#9bbfa9"/>
  <circle cx="65" cy="54.5" r="2.6" fill="#9bbfa9"/>

  <!-- Plus mark: a new copy -->
  <rect x="64" y="80" width="28" height="8" rx="4" fill="#17A05C"/>
  <rect x="74" y="70" width="8" height="28" rx="4" fill="#17A05C"/>
</svg>
